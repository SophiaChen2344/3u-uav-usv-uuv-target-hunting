seed: 7

environment:
  area_size: 400.0
  max_depth: 120.0
  num_uuvs: 3
  dt: 1.0
  max_steps: 100
  uav_height: 120.0
  uav_speed: 30.0
  usv_speed: 4.0
  uuv_speed: 8.0
  uuv_vertical_speed: 4.0
  target_speed: 3.0
  initial_uuv_depth: 120.0
  target_depth: 120.0
  capture_radius: 18.0
  uuv_search_radius: 18.0
  escape_distance: 288.0
  cooperative_capture_count: 2
  sonar_radius: 130.0
  uuv_acoustic_range: 700.0
  usv_uuv_range: 700.0
  uav_usv_range: 700.0
  camera_fov_deg: 70.0
  min_camera_radius: 120.0
  uuv_energy_budget: 65000.0
  reward:
    capture: 120.0
    cooperative_bonus: 25.0
    distance_scale: 260.0
    distance_weight: 1.0
    energy_weight: 0.025
    connectivity_weight: 2.5
    observed_bonus: 0.4
    step_penalty: 0.04
    depleted_penalty: 80.0

agent:
  gamma: 0.95
  learning_rate: 0.001
  batch_size: 128
  replay_capacity: 10000
  hidden_dim: 128
  target_update_interval: 100
  epsilon: 0.9
  epsilon_start: 0.9
  epsilon_end: 0.05
  epsilon_decay_steps: 2200
  gradient_clip: 5.0
  device: auto

training:
  episodes: 35
  iterations: 100
  eval_episodes: 6
  table_variant_episodes: 12
  progress_bar: true

flow_matching:
  use_flow_matching: true
  horizon: 10
  num_candidates: 16
  hidden_dim: 256
  num_layers: 3
  batch_size: 128
  epochs: 50
  lr: 0.001
  dataset_size: 5000
  condition_dim_auto: true
  trajectory_dim_auto: true
  use_dqn_rollouts: true
  use_heuristic_rollouts: true
  use_aco_rollouts: false
  noise_scale: 18.0
  integration_steps: 20
  gradient_clip: 5.0
  scoring:
    w_hunt: 1.0
    w_energy: 0.001
    w_comm: 3.0
    w_info: 0.25
    w_game: 0.5
    w_lyapunov: 2.0
    w_smooth: 0.05

safety:
  use_lyapunov: true
  alpha_target: 1.0
  alpha_formation: 0.0
  alpha_conn: 0.5
  alpha_energy: 0.2
  alpha_boundary: 0.2
  c: 0.001
  epsilon: 1.0
  fallback_mode: "least_unsafe"

sensing:
  use_fim: true
  use_belief_state: true
  observation_noise_uav: 20.0
  observation_noise_usv: 10.0
  observation_noise_uuv: 5.0
  fim_regularization: 1.0e-6
  info_reward_weight: 0.01
  belief_update_alpha: 0.35
  uuv_observation_range: 130.0

game:
  use_stackelberg: true
  use_intelligent_target: true
  target_action_space: 8
  horizon: 1
  candidate_mode: "all"
  w_target_dist: 1.0
  w_target_info: 0.2
  w_target_conn: 0.2
  w_target_boundary: 1.0
  w_leader_hunt: 1.0
  w_leader_energy: 0.1
  w_leader_comm: 0.2
  w_leader_info: 0.1
  w_leader_lyapunov: 1.0

experiments:
  heights: [80.0, 120.0, 160.0, 200.0, 240.0]
  uuv_speeds: [6.0, 9.0, 12.0, 15.0, 18.0]
  fig2:
    heights_m: [50.0, 60.0, 70.0, 80.0, 90.0, 100.0, 110.0, 120.0]
    speeds_knots: [3.9, 7.8, 11.7, 15.6, 19.5, 23.4, 27.3]
    dqn_train_episodes: 35
    eval_episodes: 6
  table2:
    H: [50.0, 75.0, 100.0, 125.0]
    train_episodes: 12
    eval_episodes: 6
  lyapunov_ablation:
    train_episodes: 12
    eval_episodes: 6
  fim_ablation:
    train_episodes: 12
    eval_episodes: 6
  stackelberg_ablation:
    train_episodes: 12
    eval_episodes: 6
  flow_matching_ablation:
    train_episodes: 8
    eval_episodes: 5
    dataset_size: 512
    epochs: 5
  aco:
    episodes: 8
    grid_size: 25
    ants: 100
    iterations: 100
    evaporation: 0.2
    replan_interval: 10
    alpha: 1.0
    beta: 2.5
    q: 80.0

results:
  root: results
  figures: results/figures
  tables: results/tables
  checkpoints: results/checkpoints
  datasets: results/datasets
